; php.ini khusus runtime aplikasi desktop Peminjaman Barang PNP.
; Disalin oleh scripts/prepare-php.ps1 ke folder runtime PHP.

extension_dir = "ext"

; Ekstensi wajib Laravel 13 + aplikasi ini
extension=curl
extension=fileinfo
extension=gd
extension=intl
extension=mbstring
extension=openssl
extension=pdo_sqlite
extension=sqlite3
extension=zip

; Batas sumber daya
memory_limit = 512M
max_execution_time = 120
upload_max_filesize = 25M
post_max_size = 30M

; Kebersihan & keamanan
expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = php_errors.log

; Zona waktu aplikasi (WIB)
date.timezone = Asia/Jakarta
