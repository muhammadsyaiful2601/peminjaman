; php.ini khusus runtime aplikasi desktop Peminjaman Barang PNP.
; Disalin oleh scripts/prepare-php.ps1 ke folder runtime PHP.

extension_dir = "ext"

; Ekstensi wajib Laravel 13 + aplikasi ini
extension=curl
extension=fileinfo
extension=gd
extension=intl
extension=mbstring
extension=openssl
; Wajib untuk mode hybrid (mencerminkan data ke MySQL hosting). Tanpa
; pdo_mysql, koneksi hosting gagal dengan "could not find driver".
extension=pdo_mysql
extension=pdo_sqlite
extension=sqlite3
extension=zip

; Batas sumber daya. Backup lengkap (database + foto) berupa satu arsip ZIP
; yang harus dapat diunggah kembali saat memulihkan data, jadi batas unggah
; dibuat besar dan waktu eksekusi diperpanjang untuk arsip berukuran besar.
memory_limit = 1024M
max_execution_time = 900
upload_max_filesize = 1024M
post_max_size = 1024M
max_file_uploads = 20

; Kebersihan & keamanan
expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = php_errors.log

; Zona waktu aplikasi (WIB)
date.timezone = Asia/Jakarta
