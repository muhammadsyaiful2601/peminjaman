<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <title>Menyiapkan aplikasi…</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: #ffffff;
      user-select: none;
    }
    .wrap {
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
    }
    .logo {
      width: 92px;
      height: 92px;
      object-fit: contain;
      animation: pulse 1.6s ease-in-out infinite;
    }
    .title { font-size: 15px; font-weight: 600; color: #1e293b; }
    .sub { font-size: 12px; color: #64748b; margin-top: -10px; }
    .bar {
      width: 180px;
      height: 5px;
      border-radius: 999px;
      background: #e2e8f0;
      overflow: hidden;
    }
    .bar span {
      display: block;
      width: 40%;
      height: 100%;
      border-radius: 999px;
      background: #2563eb;
      animation: slide 1.2s ease-in-out infinite;
    }
    @keyframes slide {
      0% { margin-left: -40%; }
      100% { margin-left: 100%; }
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <img class="logo" src="assets/logo-pnp.svg" alt="Logo PNP" />
    <div>
      <div class="title">Peminjaman Barang PNP</div>
    </div>
    <div class="sub">Menyiapkan aplikasi…</div>
    <div class="bar"><span></span></div>
  </div>
</body>
</html>
